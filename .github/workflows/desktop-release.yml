name: Windows desktop build and prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check backend PowerShell and JavaScript
        shell: powershell
        run: ./tests/Smoke.ps1

      - name: Integration check - launch hidden backend and fetch dashboard
        shell: powershell
        run: ./tests/BackendStartup.ps1

      - name: Publish Windows x64 desktop app
        shell: pwsh
        run: |
          dotnet publish desktop/VPNShare.Desktop/VPNShare.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o dist
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Create downloadable package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VPNShare.exe)) { throw "VPNShare.exe missing" }
          Copy-Item desktop/QUICKSTART.txt dist/README.txt
          $exe = Get-Item dist/VPNShare.exe
          Write-Host "Executable size: $($exe.Length) bytes"
          Get-ChildItem dist -Recurse | Select-Object FullName, Length
          Compress-Archive -Path dist/* -DestinationPath VPNShare-v2.0.0-preview.1-win-x64.zip -Force
          if (-not (Test-Path VPNShare-v2.0.0-preview.1-win-x64.zip)) { throw "ZIP missing" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNShare-v2.0.0-preview.1-win-x64
          path: VPNShare-v2.0.0-preview.1-win-x64.zip
          if-no-files-found: error

      - name: Publish prerelease when build succeeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v2.0.0-preview.1"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; not silently replacing release binaries."
            exit 0
          }
          gh release create $tag "VPNShare-v2.0.0-preview.1-win-x64.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VPN Share 2.0.0 preview 1 (Windows x64)" --prerelease --notes-file desktop/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease creation failed" }
